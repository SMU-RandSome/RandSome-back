name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          cache: gradle

      - name: Make application-test.yml
        run: |
          cd ./src/main/resources
          echo "$YML_TEST" | base64 --decode > application-test.yml
        shell: bash
        env:
          YML_TEST: ${{ secrets.APPLICATION_TEST }}

      - name: Make firebase.json
        run: echo '${{ secrets.FIREBASE_JSON }}' > ./src/main/resources/firebase.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon
